# .goreleaser.yaml
version: 2
project_name: gaia
builds:
  - env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
    main: ./
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -extldflags '-static'
      - -s -w
      # The stamps live in gaia/plugins/version. They used to be written to
      # gaia/commands, a package removed when the CLI moved to kernel+plugins —
      # so every released binary reported "Gaia dev, commit unknown". The
      # -buildvcs=false above removes the fallback that would have hidden it.
      - -X gaia/plugins/version.Version={{.Version}}
      - -X gaia/plugins/version.Commit={{.FullCommit}}
      - -X gaia/plugins/version.Date={{.Date}}
brews:
  - &brew_defaults
    name: "gaia"
    homepage: "https://github.com/vonglasow/gaia"
    description: "CLI to interact with local/remote LLMs (Ollama, OpenAI, Mistral), run tool actions and operator (investigate) mode"
    license: "GPL3"
    url_template: "https://github.com/vonglasow/{{ .ProjectName }}/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    repository:
      owner: vonglasow
      name: homebrew-tap
      branch: main
  - <<: *brew_defaults
    name: "gaia@{{ .Major }}.{{ .Minor }}"
