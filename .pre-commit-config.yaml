repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.177.0
    hooks:
      - id: semgrep
        args: ['--config', 'auto', '--error', '--skip-unknown-extensions']
  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: govulncheck
        args: ['./...']
        language: system
        pass_filenames: false
        types: [go]
      # First because it is the cheapest, and the one a coverage total absorbs.
      - id: tested-check
        name: every package has a test file
        entry: make tested-check
        language: system
        pass_filenames: false
        types: [go]
      # Two floors, because a total dilutes until it suddenly does not.
      - id: cover-check
        name: coverage floor
        entry: make cover-check
        language: system
        pass_filenames: false
        types: [go]
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: no-go-testing
      - id: golangci-lint
      # It runs `go test ./...` and ignores its filenames, so batches duplicate the suite.
      - id: go-unit-tests
        pass_filenames: false
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
